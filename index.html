<title>Monarch Tech</title>
<style>
:root{--bg:#070d18;--fg:#e8eef8;--muted:#93a3bb;--card:#0e182b;--line:#1b2a44;--accent:#2f9bff;--accent2:#ff8a3d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#0a0f1a;color:var(--fg);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:700;line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(2.1rem,6vw,3.6rem)}h2{font-size:clamp(1.5rem,4vw,2.2rem)}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.top{border-bottom:1px solid var(--line);background:rgba(7,13,24,.78);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 20px;padding-top:12px;padding-bottom:12px}
.brand{text-decoration:none;display:flex;gap:10px;align-items:center;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.brand img{width:42px;height:44px;object-fit:cover;border-radius:8px}
.brand span{display:flex;flex-direction:column;line-height:1.15}.brand small{font-weight:400;font-size:.62rem;letter-spacing:.14em;color:var(--muted)}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav a{padding:6px 13px;border-radius:999px;text-decoration:none;color:var(--muted);font-size:.93rem}
nav a:hover{color:var(--fg)}nav a.on{background:rgba(47,155,255,.14);color:var(--accent);font-weight:600}
nav a.adm{border:1px dashed var(--accent);color:var(--accent)}
section{padding:60px 0}
.hero{background:#0c1322;border-bottom:1px solid var(--line);padding:72px 0}
.hg{display:grid;grid-template-columns:1.25fr .75fr;gap:32px;align-items:center}
.hero h1{color:#fff}
.hero p{color:var(--muted);font-size:1.12rem;max-width:560px}
.eb{display:block;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.shield{width:100%;max-width:340px;justify-self:center;-webkit-mask-image:radial-gradient(closest-side,#000 60%,transparent 100%);mask-image:radial-gradient(closest-side,#000 60%,transparent 100%)}
@media(max-width:760px){.hg{grid-template-columns:1fr}.shield{order:-1;max-width:220px}}
.btn{display:inline-block;background:var(--accent2);color:#1a1004;text-decoration:none;border:0;border-radius:10px;padding:12px 24px;font:600 1rem system-ui,sans-serif;cursor:pointer;margin-top:12px}
.btn:hover{filter:brightness(1.1)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px}
.card h3{font-size:1.1rem;color:var(--accent)}.card p{margin:0;color:var(--muted)}
.stat{text-align:center}.stat b{display:block;font:700 2.2rem Georgia,serif;color:var(--fg)}
.hero{position:relative;overflow:hidden}.hero .hg{position:relative;z-index:2}.hv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:.75}.ho{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(7,13,24,.9),rgba(7,13,24,.5) 55%,rgba(7,13,24,.72))}
.muted{color:var(--muted)}.rows{margin-top:18px;border-top:1px solid var(--line)}.rw{display:grid;grid-template-columns:44px 1fr 1.7fr;gap:6px 20px;padding:18px 0;border-bottom:1px solid var(--line);align-items:baseline}.rw h3{margin:0;font-size:1.1rem}.rw p{margin:0;color:var(--muted)}.rn{color:var(--accent);font-size:.85rem;letter-spacing:.1em}.rw.s{grid-template-columns:1fr;gap:4px}.sp2{display:grid;grid-template-columns:1fr 1fr;gap:48px}.sp2 .rows{margin-top:0}@media(max-width:760px){.sp2{grid-template-columns:1fr;gap:24px}.rw{grid-template-columns:1fr}.rn{display:none}}.chk{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;margin:0;font-size:.95rem;color:var(--fg)}.chk input{width:auto;margin-top:4px;accent-color:var(--accent)}.chk small{display:block;color:var(--accent)}.tot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:18px 0 6px;padding:18px;border-radius:12px;background:rgba(47,155,255,.1);border:1px solid var(--line)}.tot b{font-size:1.5rem}.num{display:inline-block;font:800 .85rem system-ui;color:var(--accent);letter-spacing:.12em;margin-bottom:8px}
.fq{margin-top:10px;padding:16px 20px}.fq summary{cursor:pointer;font-weight:600}.fq p{margin-top:10px}
.cta{text-align:center;padding:44px 24px;background:var(--card)}.cta p{max-width:560px;margin:0 auto}
form.c{display:grid;gap:10px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#09111f;color:var(--fg);font:inherit}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:90px;resize:vertical}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:.9rem}
.adm-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.adm-bar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.adm-bar .sp{flex:1}.adm-bar .btn{margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:16px 0}
.panel h3{font-size:1.05rem}
label{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sm{padding:6px 10px;font-size:.85rem;border-radius:8px;border:1px solid var(--line);background:#09111f;color:var(--fg);cursor:pointer;width:auto}
.sm.del{color:#ff6b5e}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs .sm.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.item{border:1px dashed var(--line);border-radius:8px;padding:10px;margin-top:8px}
.note{font-size:.85rem;color:var(--muted)}
.note ul{margin:6px 0 0;padding-left:18px}
</style>

<script type="application/json" id="site-data">
{"name":"Monarch Tech","tagline":"Technology & Innovation","accent":"#2f9bff","accent2":"#ff8a3d","video":"/monarch-bg.mp4","footer":"© Monarch Tech – Technology & Innovation. All rights reserved.","pages":[{"id":"home","title":"Home","blocks":[{"type":"hero","eyebrow":"Technology & Innovation","heading":"Software, cloud and security for organisations that rely on technology","body":"Monarch Tech builds secure software, cloud platforms and intelligent systems that help organisations grow with confidence. From first idea to long-term support, we are the partner that stays with you.","btn":"Explore our services","link":"services"},{"type":"stats","items":[{"title":"14,200+","text":"Production models"},{"title":"1.8B","text":"Peak daily requests"},{"title":"99.992%","text":"Uptime"},{"title":"180+","text":"Enterprise customers"}]},{"type":"list","heading":"What we do","body":"Six core capabilities, one accountable team.","items":[{"title":"Software Development","text":"Custom web, mobile and desktop applications designed for performance, usability and growth."},{"title":"Cloud and DevOps","text":"Migration, automation and managed infrastructure with monitoring and cost control."},{"title":"AI and Data","text":"Analytics, dashboards and machine learning that turn raw data into decisions."},{"title":"Cybersecurity","text":"Risk assessments, secure design, hardening and incident readiness for your business."},{"title":"UI/UX Design","text":"Research-led interfaces that feel simple and keep users coming back."},{"title":"Innovation Consulting","text":"Strategy, workshops and rapid prototypes that validate ideas before you invest heavily."}]},{"type":"split","heading":"Why organisations choose Monarch","body":"We combine engineering depth with a practical, business-first mindset. Every project starts with your goals, not our tools.\nSecurity, quality and clear communication are built into everything we do, so you always know where your project stands and what it delivers.","items":[{"title":"Business first","text":"We start from your goals, not our tools."},{"title":"Security built in","text":"Protection and quality checks are part of every project."},{"title":"Clear communication","text":"Regular demos and updates, so you always know where things stand."}]},{"type":"steps","heading":"How we work","body":"A transparent process with a clear outcome at every stage.","items":[{"title":"Discover","text":"We listen, map your goals, users and constraints, and agree what success looks like."},{"title":"Design","text":"We shape the architecture, user experience and plan, with prototypes you can test."},{"title":"Build","text":"Agile sprints with regular demos, automated testing and security checks."},{"title":"Launch and grow","text":"Smooth deployment, training, monitoring and continuous improvement."}]},{"type":"split","heading":"Industries we serve","body":"Experience across sectors that depend on reliable technology.","items":[{"title":"Finance and Fintech","text":"Payments, mobile banking and compliance-ready platforms."},{"title":"Healthcare","text":"Patient records, scheduling and secure data exchange."},{"title":"Education","text":"Learning platforms, portals and digital campuses."},{"title":"Logistics","text":"Tracking, routing and fleet visibility tools."},{"title":"Agriculture","text":"IoT sensing, farm dashboards and supply-chain traceability."},{"title":"Public Sector","text":"Citizen services, e-government and open data systems."}]},{"type":"cta","heading":"Ready to start your project?","body":"Tell us what you want to achieve and we will propose a clear plan, timeline and budget.","btn":"Talk to us","link":"contact"}]},{"id":"about","title":"About","blocks":[{"type":"text","heading":"Built in the gap between ambition and infrastructure.","body":"In 2019, three engineers sat in a cramped co-working space in Austin after shipping yet another machine-learning model that worked beautifully in the lab and collapsed under real traffic. The problem wasn’t the algorithms. It was everything around them: brittle data pipelines, opaque infrastructure, and the constant firefighting required just to keep models online.\nThat frustration became Monarch Tech.\nWe started with a single conviction: modern AI systems shouldn’t require a small army of specialists just to stay reliable. Over the next six years we built the platform we wished had existed — a unified layer that turns experimental models into production systems that scale, observe themselves, and recover without 3 a.m. pages.\nToday Monarch Tech powers production AI for companies that cannot afford downtime: logistics networks routing millions of packages, financial institutions running real-time risk models, and healthcare platforms processing sensitive diagnostic data. We remain deliberately independent and product-obsessed. No acquisition theater. No pivot-of-the-month. Just the hard, unglamorous work of making AI infrastructure boringly reliable."},{"type":"stats","items":[{"title":"14,200+","text":"Production models deployed, across customer environments"},{"title":"1.8B / day","text":"Peak inference requests, during the 2025 Black Friday logistics surge"},{"title":"94%","text":"Average reduction in model downtime versus customers’ previous stacks"},{"title":"47 PB","text":"Data processed monthly, structured and unstructured"},{"title":"180+","text":"Enterprise customers, including 11 Fortune 500"},{"title":"99.992%","text":"Core platform uptime, trailing 12 months"},{"title":"68","text":"Engineers on the core platform team"},{"title":"2,400+","text":"Open-source commits (2024–2026) across observability and orchestration tools"}]},{"type":"list","heading":"Mission, vision and values","body":"What guides every decision we make.","items":[{"title":"Our mission","text":"To deliver secure, intelligent technology that helps people and organisations achieve more."},{"title":"Our vision","text":"To be a leading African technology partner recognised for innovation and integrity."},{"title":"Innovation","text":"We explore new ideas and turn them into working products."},{"title":"Integrity","text":"Honest advice, transparent pricing and promises we keep."},{"title":"Excellence","text":"High standards in every line of code and every detail of design."},{"title":"Security","text":"We protect our clients’ data and trust as if it were our own."}]},{"type":"steps","heading":"Our approach","body":"The principles behind how we deliver.","items":[{"title":"Outcome first","text":"Every feature must serve a measurable business goal."},{"title":"Security by design","text":"Protection is built in from day one, not bolted on later."},{"title":"Open communication","text":"Weekly updates, shared roadmaps and no surprises."},{"title":"Built to last","text":"Clean, documented code and support after launch."}]},{"type":"cta","heading":"Want to know more?","body":"We would be glad to introduce our team and show you how we work.","btn":"Get in touch","link":"contact"}]},{"id":"services","title":"Services","blocks":[{"type":"list","heading":"Our services","body":"Flexible expertise tailored to your goals.","items":[{"title":"Web and Mobile Apps","text":"Responsive websites, progressive web apps, Android and iOS applications, admin portals and APIs."},{"title":"Cloud Solutions","text":"Cloud migration, hosting, containers, CI/CD pipelines, backups and 24/7 monitoring."},{"title":"AI and Data","text":"Business intelligence, forecasting, chatbots, document automation and data engineering."},{"title":"Cybersecurity","text":"Penetration testing, security audits, staff awareness training and compliance support."},{"title":"UI/UX Design","text":"User research, wireframes, design systems and usability testing."},{"title":"IT Support and Managed Services","text":"Helpdesk, network setup, hardware supply and proactive maintenance."},{"title":"Systems Integration","text":"Connect payments, ERP, CRM and legacy systems into one smooth workflow."},{"title":"Training and Mentorship","text":"Hands-on programmes in software, cloud and cyber skills for teams and students."}]},{"type":"steps","heading":"Our delivery process","body":"Predictable steps from proposal to support.","items":[{"title":"Consultation","text":"A free call to understand your needs."},{"title":"Proposal","text":"Scope, timeline and fixed or phased pricing."},{"title":"Development","text":"Iterative builds with demos every two weeks."},{"title":"Testing and security","text":"Quality assurance and vulnerability checks."},{"title":"Support","text":"Maintenance plans and ongoing enhancements."}]},{"type":"cards","heading":"Technologies we use","body":"Modern, proven tools chosen for your needs.","items":[{"title":"Front end","text":"React, Vue, TypeScript, Tailwind, Flutter and React Native."},{"title":"Back end","text":"Node.js, Python, Java, .NET and PostgreSQL, MySQL and MongoDB."},{"title":"Cloud and DevOps","text":"AWS, Azure, Google Cloud, Docker, Kubernetes and GitHub Actions."},{"title":"AI and Data","text":"Python, TensorFlow, PyTorch, Power BI and large language models."}]},{"type":"faq","heading":"Frequently asked questions","body":"","items":[{"title":"How long does a typical project take?","text":"Small websites take 2 to 4 weeks. Custom applications usually take 2 to 6 months, depending on scope. We confirm timelines in the proposal."},{"title":"How do you price projects?","text":"We offer fixed-price and phased pricing after a short discovery. You always see costs before work begins."},{"title":"Do you provide support after launch?","text":"Yes. Our maintenance plans cover updates, monitoring, backups and priority support."},{"title":"Who owns the code?","text":"You do. Source code and documentation are handed over on final payment."},{"title":"How do you protect our data?","text":"We follow secure development practices, restrict access, encrypt sensitive data and sign confidentiality agreements."}]},{"type":"cta","heading":"Not sure what you need?","body":"Book a free consultation and we will recommend the right approach.","btn":"Book a consultation","link":"contact"}]},{"id":"projects","title":"Projects","blocks":[{"type":"list","heading":"Selected projects","body":"Real systems running in production today.","items":[{"title":"Project Helios: National Logistics Network","text":"A major North American carrier needed real-time route optimization that could absorb sudden weather and capacity shocks. We replaced a brittle custom stack with Monarch Tech’s orchestration and observability layer. Result: 23% reduction in empty miles, and model-related incidents down from about 40 per month to fewer than 3."},{"title":"Project Meridian: Real-time Risk Engine","text":"A global payments company required sub-40ms fraud scoring at 120k transactions per second. We delivered a multi-region deployment with automatic traffic shifting and full lineage tracking. The system has processed over 9 billion decisions with zero unplanned outages in 18 months."},{"title":"Project Atlas: Diagnostic Imaging Pipeline","text":"A healthcare AI provider needed HIPAA-compliant model serving that could handle intermittent GPU failures without dropping studies. We built a fault-tolerant inference mesh with automatic model versioning and audit trails. Mean time to recovery fell from 47 minutes to under 90 seconds."},{"title":"Internal: Monarch Control Plane","text":"Our own control plane now manages every customer environment. It has shipped 1,100+ automated recovery actions and reduced on-call load by 70% since full rollout in early 2025."}]},{"type":"stats","items":[{"title":"23%","text":"Fewer empty miles (Helios)"},{"title":"9B+","text":"Decisions processed (Meridian)"},{"title":"\u003c 90 sec","text":"Mean time to recovery (Atlas)"},{"title":"70%","text":"Less on-call load"}]},{"type":"cta","heading":"Have a project in mind?","body":"Let’s turn your idea into the next success story.","btn":"Start a project","link":"contact"}]},{"id":"team","title":"Team","blocks":[{"type":"cards","heading":"Leadership","body":"The people behind Monarch Tech.","items":[{"title":"Maya Chen, Co-founder & CEO","text":"Former infrastructure lead at a hyperscaler. Spent five years watching promising models die in production. Obsessed with making reliability the default, not the exception. Still reviews every major incident report personally."},{"title":"David Okonkwo, Co-founder & CTO","text":"Built distributed systems at two previous startups that scaled past 100M users. Believes the hardest problems in AI are no longer the models themselves but the systems that keep them honest under load. Holds several patents in adaptive resource scheduling."},{"title":"Priya Nair, VP of Product","text":"Previously led platform product at a major developer tools company. Translates the chaos of real customer environments into crisp product decisions. Known for shipping the “boring” features that actually matter at 3 a.m."},{"title":"Jordan Hale, Head of Customer Engineering","text":"Spent a decade in SRE and platform roles before joining Monarch Tech. Runs the team that sits with customers during the ugliest migrations. Measures success by how rarely customers need to call us after go-live."},{"title":"Elena Vasquez, Head of Research","text":"Leads the small applied research group focused on automatic recovery and cost-aware scheduling. Publishes regularly and still ships production code. Former academic who decided the real laboratory is other people’s production systems."}]},{"type":"text","heading":"Our culture","body":"We are curious, collaborative and committed to learning. We mentor young talent, share knowledge openly and celebrate wins together."},{"type":"split","heading":"Careers","body":"Join us and grow with the team.","items":[{"title":"Hybrid working","text":"Flexible work with a strong team culture."},{"title":"Learning budget","text":"Courses, certifications and mentorship."},{"title":"Real impact","text":"Build products that people use every day."}]},{"type":"cta","heading":"Want to join Monarch?","body":"Send your CV and portfolio and tell us how you would like to grow.","btn":"Apply now","link":"contact"}]},{"id":"budget","title":"Budget","blocks":[{"type":"cards","heading":"Packages and pricing","body":"Sample starting prices. Edit them in Admin to match your real rates.","items":[{"title":"Starter: GH₵5,000+","text":"Business website or landing page, up to 5 pages, contact form, basic SEO, 1 month support."},{"title":"Business: GH₵25,000+","text":"Custom web or mobile app, admin dashboard, integrations, security review, 3 months support."},{"title":"Enterprise: Custom","text":"Large platforms, cloud, AI and security programmes with a dedicated team and SLA."}]},{"type":"budget","heading":"Project budget estimator","body":"Choose the services you need to get an instant, indicative budget range. Final prices are confirmed after a free consultation.","btn":"GH₵","items":[{"title":"Website or landing page","text":"5000"},{"title":"Web application","text":"20000"},{"title":"Mobile app (Android and iOS)","text":"30000"},{"title":"UI/UX design","text":"6000"},{"title":"Cloud setup and DevOps","text":"8000"},{"title":"Cybersecurity audit","text":"7000"},{"title":"AI or data analytics","text":"15000"},{"title":"Monthly support and maintenance","text":"2500"}]},{"type":"faq","heading":"Budget questions","body":"","items":[{"title":"Is the estimate a fixed price?","text":"No. It is an indicative range. You receive a fixed or phased quote after we agree the scope."},{"title":"How do payments work?","text":"Typically a deposit to start, milestone payments during delivery and a final payment on handover."},{"title":"Can I start with a smaller budget?","text":"Yes. We can phase the project, launching a core version first and adding features later."}]},{"type":"cta","heading":"Want an exact quote?","body":"Tell us about your project and we will send a clear, itemised proposal.","btn":"Request a quote","link":"contact"}]},{"id":"contact","title":"Contact","blocks":[{"type":"contact","heading":"Contact us","body":"Tell us about your project and we will reply within one business day.\nOffice hours: Monday to Friday, 8:00 to 17:00 GMT.","email":"hello@monarchtech.com","phone":"+233 00 000 0000","address":"Accra, Ghana"},{"type":"faq","heading":"Before you write","body":"","items":[{"title":"What should I include in my message?","text":"Your goals, rough timeline, budget range and any existing systems."},{"title":"Do you sign NDAs?","text":"Yes. We are happy to sign a confidentiality agreement before discussing details."},{"title":"Can you work with international clients?","text":"Yes. We work remotely with clients across time zones."}]}]}]}
</script>

const RES=/^(settings|sidebar|customize|upgrade|downloads|admin|comment-.*)$/;
function clean(){
  const hx=(v,d)=>/^#[0-9a-f]{6}$/i.test(v)?v:d,S=(v,n)=>String(v==null?'':v).slice(0,n),seen={};
  D.name=S(D.name,80)||'Monarch Tech';D.tagline=S(D.tagline,80);D.footer=S(D.footer,200);D.video=/^\/(_blob\/[0-9a-f]{32}|[\w-]+\.(mp4|webm))$/.test(D.video||'')?D.video:'';D.accent=hx(D.accent,'#2f9bff');D.accent2=hx(D.accent2,'#ff8a3d');
  D.pages=(Array.isArray(D.pages)?D.pages:[]).slice(0,30).map((p,i)=>{p=p||{};const id=/^[a-z0-9-]{1,40}$/.test(p.id)&&!RES.test(p.id)&&!seen[p.id]?p.id:'p-'+i+Date.now().toString(36);seen[id]=1;
    return{id,title:S(p.title,40),blocks:(Array.isArray(p.blocks)?p.blocks:[]).slice(0,40).map(b=>{b=b||{};const o={type:['hero','text','cards','stats','contact','steps','faq','cta','budget','list','split'].includes(b.type)?b.type:'text'};
      ['heading','body','btn','link','eyebrow','email','phone','address'].forEach(k=>{if(k in b)o[k]=S(b[k],2000)});
      if(['cards','stats','steps','faq','budget','list','split'].includes(o.type))o.items=(Array.isArray(b.items)?b.items:[]).slice(0,40).map(it=>({title:S(it&&it.title,200),text:S(it&&it.text,1000)}));return o;})};});
  if(!D.pages.length)D.pages=[{id:'home',title:'Home',blocks:[]}];
}
clean();
const paras=s=>esc(s).split(/\n+/).filter(Boolean).map(p=>'<p>'+p+'</p>').join('');
const route=()=>location.hash.slice(1)||D.pages[0].id;

function block(b){
  const h=b.heading?'<h2>'+esc(b.heading)+'</h2>':'';
  if(b.type==='hero')return '<section class="hero">'+vidTag()+'<div class="wrap hg"><div>'+(b.eyebrow?'<span class="eb">'+esc(b.eyebrow)+'</span>':'')+'<h1>'+esc(b.heading)+'</h1>'+paras(b.body)+(b.btn?'<a class="btn" href="#'+esc(b.link)+'">'+esc(b.btn)+'</a>':'')+'</div><img class="shield" src="'+LOGO+'" alt="Monarch Tech shield logo"></div></section>';
  if(b.type==='text')return '<section><div class="wrap">'+h+paras(b.body)+'</div></section>';
  if(b.type==='cards')return '<section><div class="wrap">'+h+(b.body?'<p class="muted">'+esc(b.body)+'</p>':'')+'<div class="grid">'+b.items.map(i=>'<div class="card"><h3>'+esc(i.title)+'</h3><p>'+esc(i.text)+'</p></div>').join('')+'</div></div></section>';
  if(b.type==='stats')return '<section style="padding:32px 0"><div class="wrap"><div class="grid">'+b.items.map(i=>'<div class="card stat"><b>'+esc(i.title)+'</b><span class="muted">'+esc(i.text)+'</span></div>').join('')+'</div></div></section>';
  if(b.type==='list')return '<section><div class="wrap">'+h+(b.body?'<p class="muted">'+esc(b.body)+'</p>':'')+'<div class="rows">'+b.items.map((i,n)=>'<div class="rw"><span class="rn">'+String(n+1).padStart(2,'0')+'</span><h3>'+esc(i.title)+'</h3><p>'+esc(i.text)+'</p></div>').join('')+'</div></div></section>';
  if(b.type==='split')return '<section><div class="wrap sp2"><div>'+h+paras(b.body)+'</div><div class="rows">'+b.items.map(i=>'<div class="rw s"><h3>'+esc(i.title)+'</h3><p>'+esc(i.text)+'</p></div>').join('')+'</div></div></section>';
  if(b.type==='steps')return '<section><div class="wrap">'+h+(b.body?'<p class="muted">'+esc(b.body)+'</p>':'')+'<div class="grid">'+b.items.map((i,n)=>'<div class="card"><span class="num">'+String(n+1).padStart(2,'0')+'</span><h3>'+esc(i.title)+'</h3><p>'+esc(i.text)+'</p></div>').join('')+'</div></div></section>';
  if(b.type==='faq')return '<section><div class="wrap" style="max-width:820px">'+h+(b.body?'<p class="muted">'+esc(b.body)+'</p>':'')+b.items.map(i=>'<details class="card fq"><summary>'+esc(i.title)+'</summary><p>'+esc(i.text)+'</p></details>').join('')+'</div></section>';
  if(b.type==='cta')return '<section><div class="wrap"><div class="card cta">'+h+paras(b.body)+(b.btn?'<a class="btn" href="#'+esc(b.link)+'">'+esc(b.btn)+'</a>':'')+'</div></div></section>';
  if(b.type==='budget')return '<section><div class="wrap">'+h+(b.body?'<p class="muted">'+esc(b.body)+'</p>':'')+'<div class="card bud" data-cur="'+esc(b.btn)+'"><div class="grid">'+b.items.map(i=>{const v=parseFloat(i.text)||0;return '<label class="chk"><input type="checkbox" data-p="'+v+'" onchange="calcB(this)"><span>'+esc(i.title)+'<small>'+esc(b.btn)+v.toLocaleString()+'</small></span></label>';}).join('')+'</div><div class="grid"><div><label>Project size</label><select class="cx" onchange="calcB(this)"><option value="1">Small (basic)</option><option value="1.5">Medium (standard)</option><option value="2.2">Large (advanced)</option></select></div><label class="chk" style="align-self:end"><input type="checkbox" class="rush" onchange="calcB(this)"><span>Rush delivery (+25%)</span></label></div><div class="tot"><span>Estimated budget</span><b class="out">Select services</b></div><a class="btn" href="#contact">Request a formal quote</a></div></div></section>';
  if(b.type==='contact')return '<section><div class="wrap">'+h+'<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div>'+paras(b.body)+'<p><b>Email</b><br>'+esc(b.email)+'</p><p><b>Phone</b><br>'+esc(b.phone)+'</p><p><b>Address</b><br>'+esc(b.address)+'</p></div><form class="c card" onsubmit="return sendMsg(this)"><input name="w" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px"><input name="n" placeholder="Your name" maxlength="80" required><input name="e" type="email" placeholder="Your email" maxlength="120" required><textarea name="m" placeholder="Your message" maxlength="2000" required></textarea><button class="btn" type="submit">Send message</button></form></div></div></section>';
  return '';
}
let T0=Date.now(),LAST=0;
function calcB(el){
  const box=el.closest('.bud'),cur=box.dataset.cur;let t=0;
  box.querySelectorAll('input[data-p]:checked').forEach(c=>t+=+c.dataset.p);
  t*=parseFloat(box.querySelector('.cx').value)*(box.querySelector('.rush').checked?1.25:1);
  const r=v=>cur+(Math.round(v/50)*50).toLocaleString();
  box.querySelector('.out').textContent=t?r(t*.85)+' – '+r(t*1.15):'Select services';
}
function sendMsg(f){
  const g=v=>String(v||'').replace(/[\r\n\t]+/g,' ').trim(),ok=/^[^\s@?&=]+@[^\s@?&=]+\.[^\s@?&=]+$/;
  if(f.w.value)return false;
  if(Date.now()-T0<3000||Date.now()-LAST<15000){alert('Please wait a moment and try again.');return false;}
  const n=g(f.n.value).slice(0,80),e=g(f.e.value).slice(0,120),m=String(f.m.value).slice(0,2000);
  const c=D.pages.flatMap(p=>p.blocks).find(b=>b.type==='contact');
  if(!ok.test(e)){alert('Please enter a valid email address.');return false;}
  if(!c||!ok.test(c.email||'')){alert('The contact email is not set up yet.');return false;}
  LAST=Date.now();
  location.href='mailto:'+encodeURIComponent(c.email).replace('%40','@')+'?subject='+encodeURIComponent('Website enquiry from '+n)+'&body='+encodeURIComponent(m+'\n\n'+n+' ('+e+')');
  return false;
}
function header(cur){
  return '<header class="top"><div class="wrap"><a class="brand" href="#'+esc(D.pages[0].id)+'"><img src="'+LOGO+'" alt=""><span>'+esc(D.name)+'<small>'+esc(D.tagline)+'</small></span></a><nav>'+D.pages.map(p=>'<a href="#'+esc(p.id)+'" class="'+(p.id===cur?'on':'')+'">'+esc(p.title)+'</a>').join('')+(canEdit?'<a class="adm" href="#admin">Admin</a>':'')+'</nav></div></header>';
}
function vidTag(){
  const rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  return D.video&&!rm?'<video class="hv" src="'+esc(D.video)+'" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video><div class="ho"></div>':'';
}
function applyVid(){document.querySelectorAll('video.hv').forEach(v=>{v.muted=true;v.onended=()=>{v.currentTime=0;v.play().catch(()=>{});};const p=v.play();if(p&&p.catch)p.catch(()=>{});});}
async function upVid(i){
  const f=i.files[0];if(!f)return;
  if(f.size>20*1048576){alert('The video must be under 20 MB. Please compress it first.');return;}
  try{const a=await claude.use('assets');if(!a){alert('Video upload is available to editors only.');return;}
    msg='Uploading video…';renderAdmin();const r=await a.upload(f);setp('video','/_blob/'+r.id);applyVid();msg='Video uploaded. Publish to make it live.';renderAdmin();
  }catch(e){msg='Upload failed. Try a smaller MP4.';renderAdmin();}
}
function render(){
  document.documentElement.style.setProperty('--accent',D.accent);document.documentElement.style.setProperty('--accent2',D.accent2);
  const r=route();
  if(r==='admin'){document.title='Admin · '+D.name;return renderAdmin();}
  const pg=D.pages.find(p=>p.id===r)||D.pages[0];
  document.title=pg.title+' · '+D.name;
  $.innerHTML=header(pg.id)+'<main>'+pg.blocks.map(block).join('')+'</main><footer><div class="wrap">'+esc(D.footer)+'</div></footer>';
  window.scrollTo(0,0);applyVid();
}

/* ---------- admin ---------- */
function setp(path,v){const k=path.split('.');let o=D;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v;dirty=true;if(path==='accent'||path==='accent2')document.documentElement.style.setProperty('--'+path,v);upd();}
function upd(){const b=document.getElementById('pubBtn');if(b)b.textContent=dirty?'Publish changes ●':'Publish changes';}
function fld(label,path,val,area){
  const a='maxlength="2000" oninput="setp(\''+path+'\',this.value)"';
  return '<label>'+label+'</label>'+(area?'<textarea '+a+'>'+esc(val)+'</textarea>':'<input '+a+' value="'+esc(val)+'">');
}
const TPL={steps:{type:'steps',heading:'Our process',body:'',items:[{title:'Step one',text:'Describe it.'}]},faq:{type:'faq',heading:'FAQ',body:'',items:[{title:'Question?',text:'Answer.'}]},cta:{type:'cta',heading:'Call to action',body:'Invite visitors to act.',btn:'Contact us',link:'contact'},budget:{type:'budget',heading:'Budget estimator',body:'',btn:'GH₵',items:[{title:'Service',text:'1000'}]},list:{type:'list',heading:'Row list',body:'',items:[{title:'Item',text:'Description'}]},split:{type:'split',heading:'Text with list',body:'Write your text here.',items:[{title:'Point',text:'Description'}]},hero:{type:'hero',eyebrow:'',heading:'New headline',body:'Describe your offer.',btn:'Learn more',link:'about'},text:{type:'text',heading:'New section',body:'Write your content here.'},cards:{type:'cards',heading:'New cards section',body:'',items:[{title:'Title',text:'Description'}]},stats:{type:'stats',items:[{title:'100',text:'Label'}]},contact:{type:'contact',heading:'Contact us',body:'We’d love to hear from you.',email:'',phone:'',address:''}};
function act(fn){fn();dirty=true;renderAdmin();}
function addPage(){act(()=>{const t='New page';let id='p-'+Date.now().toString(36);D.pages.push({id,title:t,blocks:[JSON.parse(JSON.stringify(TPL.text))]});selP=D.pages.length-1;});}
function delPage(i){if(D.pages.length<2||!confirm('Delete this page?'))return;act(()=>{D.pages.splice(i,1);selP=0;});}
function mvPage(i,d){const j=i+d;if(j<0||j>=D.pages.length)return;act(()=>{[D.pages[i],D.pages[j]]=[D.pages[j],D.pages[i]];selP=j;});}
function addBlock(){const t=document.getElementById('nbt').value;act(()=>D.pages[selP].blocks.push(JSON.parse(JSON.stringify(TPL[t]))));}
function delBlock(b){if(confirm('Delete this block?'))act(()=>D.pages[selP].blocks.splice(b,1));}
function mvBlock(b,d){const a=D.pages[selP].blocks,j=b+d;if(j<0||j>=a.length)return;act(()=>{[a[b],a[j]]=[a[j],a[b]];});}
function addItem(b){act(()=>{const bl=D.pages[selP].blocks[b];bl.items.push(bl.type==='stats'?{title:'100',text:'Label'}:{title:'Title',text:'Description'});});}
function delItem(b,i){act(()=>D.pages[selP].blocks[b].items.splice(i,1));}
function blockEd(b,bi){
  const P='pages.'+selP+'.blocks.'+bi+'.';
  let h='<div class="panel"><div class="row"><h3 style="margin:0;flex:1;text-transform:capitalize">'+b.type+' block</h3><button class="sm" onclick="mvBlock('+bi+',-1)">↑</button><button class="sm" onclick="mvBlock('+bi+',1)">↓</button><button class="sm del" onclick="delBlock('+bi+')">Delete</button></div>';
  if(b.type!=='stats')h+=fld('Heading',P+'heading',b.heading);
  if(b.type!=='cards'||true)if(b.type!=='stats')h+=fld(b.type==='cards'?'Intro text':'Text',P+'body',b.body,b.type!=='cards');
  if(b.type==='hero'||b.type==='cta')h+=fld('Small label above headline',P+'eyebrow',b.eyebrow)+fld('Button text',P+'btn',b.btn)+'<label>Button goes to</label><select onchange="setp(\''+P+'link\',this.value)">'+D.pages.map(p=>'<option value="'+esc(p.id)+'"'+(p.id===b.link?' selected':'')+'>'+esc(p.title)+'</option>').join('')+'</select>';
  if(b.type==='budget')h+=fld('Currency symbol',P+'btn',b.btn);
  if(b.type==='contact')h+=fld('Email (messages are sent here)',P+'email',b.email)+fld('Phone',P+'phone',b.phone)+fld('Address',P+'address',b.address);
  if(b.items){
    h+='<label>'+(b.type==='stats'?'Numbers':'Cards')+'</label>';
    b.items.forEach((it,ii)=>{h+='<div class="item">'+fld(b.type==='stats'?'Value':b.type==='budget'?'Service name':'Title',P+'items.'+ii+'.title',it.title)+fld(b.type==='stats'?'Label':b.type==='budget'?'Base price (number only)':'Text',P+'items.'+ii+'.text',it.text)+'<div style="margin-top:8px"><button class="sm del" onclick="delItem('+bi+','+ii+')">Remove</button></div></div>';});
    h+='<p><button class="sm" onclick="addItem('+bi+')">+ Add item</button></p>';
  }
  return h+'</div>';
}
function renderAdmin(){
  if(!canEdit){$.innerHTML=header('')+'<section><div class="wrap"><h2>Admin</h2><p class="muted">Only the site owner or editors can open the admin area. If that is you, open this page while signed in to Claude.</p><a class="btn" href="#'+esc(D.pages[0].id)+'">Back to site</a></div></section>';return;}
  if(selP>=D.pages.length)selP=0;
  const pg=D.pages[selP];
  let h='<div class="adm-bar"><div class="wrap"><b>Admin</b><a class="sm" href="#'+esc(pg.id)+'" style="text-decoration:none">View page</a><span class="sp note">'+esc(msg||'Changes are previewed live. Publish to make them public.')+'</span><button class="sm" onclick="if(!dirty||confirm(\'Discard all unpublished changes?\')){dirty=false;location.reload()}">Discard</button><button class="btn" id="pubBtn" style="margin:0;padding:8px 16px" onclick="publish()">Publish changes'+(dirty?' ●':'')+'</button></div></div><div class="wrap">';
  h+='<div class="panel"><h3>Site settings</h3>'+fld('Company name','name',D.name)+fld('Tagline','tagline',D.tagline)+fld('Footer text','footer',D.footer)+'<label>Hero banner video (looping, silent, MP4 or WebM under 20 MB)</label><div class="row"><input type="file" accept="video/mp4,video/webm" onchange="upVid(this)" style="flex:1"><button class="sm del" onclick="setp(\'video\',\'\');applyVid();renderAdmin()">Remove video</button></div><p class="note">'+(D.video?'A hero video is active.':'No hero video set.')+'</p><label>Brand colour (blue)</label><input type="color" value="'+esc(D.accent)+'" oninput="setp(\'accent\',this.value)" style="height:42px;padding:3px"><label>Second brand colour (orange)</label><input type="color" value="'+esc(D.accent2)+'" oninput="setp(\'accent2\',this.value)" style="height:42px;padding:3px"></div>';
  h+='<div class="panel"><h3>Pages</h3><div class="tabs">'+D.pages.map((p,i)=>'<button class="sm '+(i===selP?'on':'')+'" onclick="selP='+i+';renderAdmin()">'+esc(p.title)+'</button>').join('')+'<button class="sm" onclick="addPage()">+ New page</button></div>';
  h+=fld('Page title (shown in menu)','pages.'+selP+'.title',pg.title);
  h+='<div class="row" style="margin-top:10px"><button class="sm" onclick="mvPage('+selP+',-1)">← Move earlier</button><button class="sm" onclick="mvPage('+selP+',1)">Move later →</button><button class="sm del" onclick="delPage('+selP+')">Delete page</button></div></div>';
  h+=pg.blocks.map((b,i)=>blockEd(b,i)).join('');
  h+='<div class="panel row"><select id="nbt" style="max-width:220px"><option value="text">Text section</option><option value="cards">Cards grid</option><option value="hero">Hero banner</option><option value="stats">Numbers</option><option value="steps">Process steps</option><option value="faq">FAQ</option><option value="cta">Call-to-action banner</option><option value="budget">Budget estimator</option><option value="list">Numbered row list</option><option value="split">Text with side list</option><option value="contact">Contact form</option></select><button class="sm" onclick="addBlock()">+ Add block to this page</button></div></div><br>';
  h+='<div class="panel"><h3>Security</h3><div class="note">How this site is protected:<ul><li>Only the owner and invited editors can open Admin or publish. This is enforced by Claude, not just hidden in the page.</li><li>All text is escaped and validated on load, so pasted code cannot run.</li><li>No third-party scripts, trackers or external requests.</li><li>The contact form has spam protection and rate limiting, and nothing is stored in the browser.</li><li>Publishing and discarding both ask for confirmation. Share the page with Editor access only to people you trust.</li></ul></div></div>';
  $.innerHTML=h;
}
async function publish(){
  if(!canEdit||!confirm('Publish changes to the live site?'))return;
  if(!art){msg='Publishing is unavailable in this view.';return renderAdmin();}
  try{
    const c=document.documentElement.cloneNode(true);
    c.querySelector('#app').innerHTML='';
    c.querySelector('#site-data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
    c.removeAttribute('style');
    msg='Publishing…';renderAdmin();
    await art.publish('<!doctype html>\n'+c.outerHTML);
    dirty=false;
  }catch(e){msg='Could not publish: '+(e&&e.code||e&&e.message||'error');renderAdmin();}
}
window.addEventListener('hashchange',render);
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
render();
(async()=>{
  try{
    if(!window.claude||!claude.use)return;
    const u=await claude.use('user');
    canEdit=!!(u&&u.canEdit());
    art=await claude.use('artifact');
    if(!art)canEdit=canEdit&&false||canEdit;
    render();
  }catch(e){}
})();
</script>
</body>
</html>
